<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Wholefit Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --green: #16A34A;
  --green-dark: #166534;
  --green-light: #DCFCE7;
  --bg: #F8FAFC;
  --white: #FFFFFF;
  --text: #0F172A;
  --text-sec: #64748B;
  --blue: #2563EB;
  --blue-light: #DBEAFE;
  --orange: #F59E0B;
  --orange-light: #FEF3C7;
  --red: #DC2626;
  --red-light: #FEE2E2;
  --yellow: #EAB308;
  --yellow-light: #FEF9C3;
  --border: #E2E8F0;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.08), 0 4px 6px rgba(0,0,0,.05);
  --radius: 12px;
  --radius-sm: 8px;
  --nav-h: 64px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
/* NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;z-index:100;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:none;background:none;color:var(--text-sec);font-size:11px;font-family:inherit;font-weight:600;padding:4px 2px;transition:color .2s}
.nav-btn svg{width:26px;height:26px;stroke-width:1.8}
.nav-btn.active{color:var(--green)}
/* HEADER */
.top-header{background:var(--white);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.top-header h1{font-size:19px;font-weight:700;color:var(--green-dark);margin:0}
.top-header p{font-size:13px;color:var(--text-sec);margin:2px 0 0}
/* PAGES */
.page{display:none;padding:12px 14px 16px;max-width:900px;margin:0 auto}
.page.active{display:block}
/* CARDS */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.card-sm{background:var(--white);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:12px;margin-bottom:10px;border:1px solid var(--border)}
/* STATUS CHIPS */
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.chip-green{background:var(--green-light);color:var(--green-dark)}
.chip-blue{background:var(--blue-light);color:var(--blue)}
.chip-orange{background:var(--orange-light);color:#92400E}
.chip-red{background:var(--red-light);color:var(--red)}
.chip-yellow{background:var(--yellow-light);color:#713F12}
.chip-gray{background:#F1F5F9;color:var(--text-sec)}
/* EMPLOYEE SELECT */
.emp-selector{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.emp-btn{background:var(--white);border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px;cursor:pointer;text-align:left;transition:all .2s;font-family:inherit}
.emp-btn:hover{border-color:var(--green);background:var(--green-light)}
.emp-btn.selected{border-color:var(--green);background:var(--green-light)}
.emp-btn .emp-name{font-size:15px;font-weight:700;color:var(--text)}
.emp-btn .emp-role{font-size:12px;color:var(--text-sec);margin-top:3px}
.emp-btn .emp-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--white);margin-bottom:8px}
/* STATUS CARD */
.status-card{border-radius:var(--radius);padding:20px;margin-bottom:14px;border:1px solid transparent}
.status-work{background:linear-gradient(135deg,#F0FDF4,#DCFCE7);border-color:#BBF7D0}
.status-off{background:linear-gradient(135deg,#F0F9FF,#DBEAFE);border-color:#BFDBFE}
.status-conflict{background:linear-gradient(135deg,#FFF7ED,#FEF3C7);border-color:#FDE68A}
.status-unknown{background:linear-gradient(135deg,#F8FAFC,#F1F5F9);border-color:var(--border)}
.status-holiday{background:linear-gradient(135deg,#FFF1F2,#FFE4E6);border-color:#FECDD3}
.status-title{font-size:22px;font-weight:800;margin-bottom:6px}
.status-work .status-title{color:var(--green-dark)}
.status-off .status-title{color:var(--blue)}
.status-conflict .status-title{color:#92400E}
.status-unknown .status-title{color:var(--text-sec)}
.status-holiday .status-title{color:var(--red)}
.detail-row{display:flex;align-items:flex-start;gap:10px;margin-top:12px;font-size:14px}
.detail-label{color:var(--text-sec);min-width:72px;flex-shrink:0;font-size:13px;padding-top:1px}
.detail-value{color:var(--text);font-weight:500}
/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav h2{font-size:18px;font-weight:700;text-transform:capitalize}
.cal-nav button{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;color:var(--text-sec);transition:all .2s}
.cal-nav button:hover{background:var(--green-light);color:var(--green-dark);border-color:var(--green)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-header{font-size:12px;font-weight:700;color:var(--text-sec);text-align:center;padding:6px 0;text-transform:uppercase}
.cal-day{min-height:72px;border-radius:8px;padding:6px 4px;cursor:pointer;border:1px solid transparent;transition:all .2s;position:relative;background:var(--white)}
.cal-day:hover{border-color:var(--green);background:var(--green-light)}
.cal-day.today{border-color:var(--green);background:var(--green-light)}
.cal-day.today .cal-num{background:var(--green);color:var(--white);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.cal-day.other-month{opacity:.35}
.cal-day.selected{border-color:var(--blue);background:var(--blue-light)}
.cal-num{font-size:14px;font-weight:700;text-align:center;margin-bottom:4px;color:var(--text)}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.cal-dot{width:7px;height:7px;border-radius:50%}
.dot-work{background:var(--green)}
.dot-pcv{background:var(--green)}
.dot-bc{background:var(--blue)}
.dot-off{background:#94A3B8}
.dot-conflict{background:var(--red)}
.dot-event{background:var(--orange)}
.dot-holiday{background:var(--red)}
.cal-day.empty{background:transparent;border:none;cursor:default}
/* VIEWS */
.view-tabs{display:flex;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-bottom:14px;gap:4px}
.view-tab{flex:1;text-align:center;padding:9px 4px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text-sec);transition:all .2s;border:none;background:none;font-family:inherit}
.view-tab.active{background:var(--green);color:var(--white)}
/* SECTION HEADERS */
.section-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:10px;margin-top:4px}
/* ALERT BANNER */
.alert{border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.alert-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.alert p{font-size:13px;line-height:1.5}
.alert strong{display:block;font-size:13px;margin-bottom:2px}
.alert-red{background:var(--red-light);border:1px solid #FECACA;color:var(--red)}
.alert-orange{background:var(--orange-light);border:1px solid #FDE68A;color:#92400E}
.alert-yellow{background:var(--yellow-light);border:1px solid #FEF08A;color:#713F12}
/* TEAM GRID */
.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.team-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s}
.team-card:hover{border-color:var(--green);box-shadow:var(--shadow-md)}
.team-avatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--white);margin-bottom:10px}
.team-name{font-size:15px;font-weight:700}
.team-role{font-size:12px;color:var(--text-sec);margin-bottom:10px}
.team-stats{display:flex;gap:6px;flex-wrap:wrap}
/* WEEKLY */
.week-day{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px}
.week-day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.week-day-name{font-size:15px;font-weight:700;text-transform:capitalize}
.week-day-date{font-size:13px;color:var(--text-sec)}
/* EMP-CARDS CALENDAR (semana y mes) */
.ec-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:6px}
.ec-grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.ec-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;transition:box-shadow .2s}
.ec-card:hover{box-shadow:var(--shadow-md)}
.ec-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ec-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}
.ec-name{font-size:14px;font-weight:700;line-height:1.2}
.ec-role{font-size:11px;color:var(--text-sec);margin-top:2px}
.ec-days-row{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto}
.ec-day-col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:34px}
.ec-day-label{font-size:10px;font-weight:600;color:var(--text-sec);text-transform:uppercase;letter-spacing:.3px}
.ec-day-chip{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;cursor:pointer;transition:transform .15s}
.ec-day-chip:hover{transform:scale(1.12)}
.ec-day-chip.chip-bc{background:#DBEAFE;color:#1D4ED8}
.ec-day-chip.chip-pcv{background:#D1FAE5;color:#065F46}
.ec-day-chip.chip-libre{background:#FEF9C3;color:#854D0E}
.ec-day-chip.chip-holiday{background:#FEE2E2;color:#991B1B}
.ec-day-chip.chip-nd{background:#F1F5F9;color:#94A3B8}
.ec-day-chip.chip-today{box-shadow:0 0 0 2px var(--green)}
/* Legend row */
.ec-legend{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ec-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-sec);font-weight:600}
.ec-legend-dot{width:14px;height:14px;border-radius:4px}
/* Monthly emp grid — compacto (todos los empleados) */
.ec-month-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:4px}
.ec-month-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.ec-month-dow-label{font-size:9px;font-weight:700;color:var(--text-sec);text-align:center;padding:2px 0}
.ec-month-chip{height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;cursor:pointer}
.ec-month-empty{height:24px}
.ec-month-chip.chip-bc{background:#DBEAFE;color:#1D4ED8}
.ec-month-chip.chip-pcv{background:#D1FAE5;color:#065F46}
.ec-month-chip.chip-libre{background:#FEF9C3;color:#854D0E}
.ec-month-chip.chip-holiday{background:#FEE2E2;color:#991B1B}
.ec-month-chip.chip-nd{background:#F1F5F9;color:#94A3B8}
.ec-month-chip.chip-today{box-shadow:0 0 0 2px var(--green)}
/* Monthly emp grid — GRANDE (un solo empleado, pantalla completa) */
.ec-month-days-lg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.ec-month-dow-lg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.ec-month-dow-label-lg{font-size:12px;font-weight:700;color:var(--text-sec);text-align:center;padding:4px 0;text-transform:uppercase}
.ec-month-chip-lg{height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:800;cursor:pointer;transition:transform .15s;gap:2px}
.ec-month-chip-lg:hover{transform:scale(1.05)}
.ec-month-empty-lg{height:48px}
.ec-month-chip-lg.chip-bc{background:#DBEAFE;color:#1D4ED8}
.ec-month-chip-lg.chip-pcv{background:#D1FAE5;color:#065F46}
.ec-month-chip-lg.chip-libre{background:#FEF9C3;color:#854D0E}
.ec-month-chip-lg.chip-holiday{background:#FEE2E2;color:#991B1B}
.ec-month-chip-lg.chip-nd{background:#F1F5F9;color:#94A3B8}
.ec-month-chip-lg.chip-today{box-shadow:0 0 0 3px var(--green)}
/* DAILY */
.daily-sede{border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.daily-sede.pcv{border-left:4px solid var(--green)}
.daily-sede.bc{border-left:4px solid var(--blue)}
.daily-sede-title{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.daily-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px}
.daily-row:last-child{border-bottom:none}
.daily-row-label{color:var(--text-sec)}
.daily-row-value{font-weight:600;color:var(--text);text-align:right}
/* ADMIN */
.admin-section{margin-bottom:18px}
.admin-table{width:100%;border-collapse:collapse;font-size:13px}
.admin-table th{background:#F8FAFC;padding:10px 12px;text-align:left;font-weight:600;color:var(--text-sec);border-bottom:2px solid var(--border);font-size:12px}
.admin-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.admin-table tr:hover td{background:#F8FAFC}
/* DATE SELECTOR */
.date-selector{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.date-selector select,.date-selector input{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;color:var(--text);font-family:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.btn-green{background:var(--green);color:var(--white)}
.btn-green:hover{background:var(--green-dark)}
.btn-outline{background:var(--white);border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--green);color:var(--green)}
/* LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sec)}
/* SCROLL CONTAINER */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* FILTERS */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter-chip{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--text-sec);transition:all .2s;font-family:inherit}
.filter-chip.active{background:var(--green);color:var(--white);border-color:var(--green)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:16px 16px 0 0;padding:24px;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:5px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:19px;font-weight:700;margin-bottom:16px}
/* SEDE CARDS */
.sede-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.sede-title{font-size:17px;font-weight:700;margin-bottom:5px}
.sede-hours{font-size:13px;color:var(--text-sec);margin-bottom:12px}
.sede-staff{margin-top:10px}
.staff-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.staff-row:last-child{border-bottom:none}
.staff-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--white);flex-shrink:0}
/* HISTORY */
.history-entry{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:6px}
.history-entry .he-date{font-size:10px;color:var(--text-sec)}
.history-entry .he-desc{font-size:12px;font-weight:600;margin-top:2px}
/* PRINT */
@media print{.bottom-nav,.modal-overlay{display:none!important}.page{display:block!important}}
/* RESPONSIVE DESKTOP */
@media(min-width:600px){.emp-selector{grid-template-columns:repeat(3,1fr)}.team-grid{grid-template-columns:repeat(3,1fr)}}
/* RESPONSIVE MOBILE — pantallas pequeñas ≤380px */
@media(max-width:380px){
  .cal-day{min-height:58px;padding:4px 2px}
  .cal-num{font-size:12px}
  .cal-header{font-size:10px;padding:4px 0}
  .cal-dot{width:6px;height:6px}
  .team-grid{grid-template-columns:1fr 1fr}
  .emp-selector{grid-template-columns:1fr 1fr}
  .ec-day-chip{width:28px;height:28px;font-size:9px}
  .ec-day-col{min-width:30px}
  .ec-month-chip-lg{height:40px;font-size:12px}
  .ec-month-empty-lg{height:40px}
}
/* EMPTY STATE */
.empty-state{text-align:center;padding:32px 20px;color:var(--text-sec)}
.empty-state .es-icon{font-size:40px;margin-bottom:10px}
.empty-state p{font-size:14px}

/* ══════════════════════════════════════
   BUBBLES & CHIPS
   ══════════════════════════════════════ */
.bc-day-wrap{background:linear-gradient(135deg,#FFF7ED 0%,#ECFDF5 100%);border-radius:16px;padding:14px;margin-bottom:12px}
.bc-status-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bc-date-label{font-size:13px;font-weight:700;color:var(--text);text-transform:capitalize}
.bc-status-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bc-status-ok{background:#D1FAE5;color:#065F46}
.bc-status-warn{background:#FEE2E2;color:#991B1B}
.bc-venues-row{display:flex;gap:8px}
.bc-venue-col{flex:1;min-width:0;background:#FFFFFF;border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.bc-venue-col.bc-venue-pcv{border-top:3px solid #16A34A}
.bc-venue-col.bc-venue-bc{border-top:3px solid #2563EB}
.bc-venue-col.bc-venue-closed{opacity:.55;background:#F8FAFC}
.bc-venue-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.bc-venue-tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:12px;letter-spacing:.5px}
.bc-venue-tag.tag-pcv{background:#D1FAE5;color:#065F46}
.bc-venue-tag.tag-bc{background:#DBEAFE;color:#1D4ED8}
.bc-venue-hours{font-size:10px;color:var(--text-sec);font-weight:500}
.bc-section-label{font-size:10px;font-weight:600;color:var(--text-sec);letter-spacing:.3px;text-transform:uppercase;margin:8px 0 4px}
.bc-bubbles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bc-bubble{display:flex;align-items:center;gap:5px;background:#F8FAFC;border-radius:20px;padding:4px 8px 4px 4px}
.bc-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.bc-bubble-name{font-size:11px;font-weight:600;color:var(--text)}
.bc-role-chip{display:inline-block;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:700;letter-spacing:.2px}
.bc-role-cajera{background:#EDE9FE;color:#5B21B6}
.bc-role-barista{background:#FEF3C7;color:#92400E}
.bc-badge-fija{display:inline-block;background:#FEF3C7;color:#92400E;border-radius:8px;font-size:8px;font-weight:700;padding:1px 5px;margin-left:2px;vertical-align:middle}
.bc-badge-rota{display:inline-block;background:#E0F2FE;color:#0369A1;border-radius:8px;font-size:8px;font-weight:700;padding:1px 5px;margin-left:2px;vertical-align:middle}
.bc-rest-section{margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.07)}
.bc-rest-label{font-size:10px;font-weight:600;color:var(--text-sec);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
.bc-rest-bubbles{display:flex;flex-wrap:wrap;gap:5px}
.bc-rest-avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff;opacity:.8;cursor:default}
.bc-rest-name{font-size:10px;color:var(--text-sec);font-weight:500;margin-left:3px}
.bc-rest-item{display:flex;align-items:center}
</style>

// Horarios habituales PCV
function getPCVHours(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay(); // 0=dom,1=lun,...,6=sab
  if (SPECIAL_HOURS[dateStr]) {
    if (SPECIAL_HOURS[dateStr].holiday) return null;
    return SPECIAL_HOURS[dateStr].pcv;
  }
  if (dow >= 5 || dow === 0) return '9:00 a.m. – 8:00 p.m.'; // vie-dom
  return '9:00 a.m. – 7:00 p.m.'; // lun-jue
}

function getBCHours(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay();
  if (SPECIAL_HOURS[dateStr]) {
    if (SPECIAL_HOURS[dateStr].holiday) return null;
    return SPECIAL_HOURS[dateStr].bc;
  }
  // BC cerrado sábados desde el 14/11 y siempre domingos
  if (dow === 0) return null; // domingo
  if (dow === 6 && dateStr >= '2026-11-14') return null; // sábados desde 14/11
  if (dow === 6) return null; // sábados anteriores también
  return '8:00 a.m. – 6:00 p.m.';
}

// ═══════════════════════════════════════════════
// MODIFICACIONES (capa separada)
// ═══════════════════════════════════════════════
// v7: Ajuste manual Maikol(B4) Nov20-30: libre 20,23,24,29,30 / trabaja 21,22,25,26,27,28; Samuel(B2) ajustado en consecuencia; Susana+Argenis sin cambios
const DATA_VERSION = 'v7';
if (localStorage.getItem('wf_data_version') !== DATA_VERSION) {
  localStorage.removeItem('wf_mods');
  localStorage.removeItem('wf_history');
  localStorage.setItem('wf_data_version', DATA_VERSION);
}
let modifications = JSON.parse(localStorage.getItem('wf_mods') || '[]');
let modHistory = JSON.parse(localStorage.getItem('wf_history') || '[]');

function getSchedule(dateStr) {
  const base = RAW_SCHEDULE[dateStr] || null;
  const mod = modifications.find(m => m.date === dateStr);
  if (!base) return null;
  if (!mod) return {...base};
  return {...base, ...mod.overrides, _modified: true};
}

function saveModification(dateStr, overrides, description) {
  modifications = modifications.filter(m => m.date !== dateStr);
  modifications.push({ date: dateStr, overrides });
  modHistory.unshift({
    date: dateStr,
    description,
    timestamp: new Date().toISOString(),
    overrides
  });
  localStorage.setItem('wf_mods', JSON.stringify(modifications));
  localStorage.setItem('wf_history', JSON.stringify(modHistory.slice(0, 100)));
}

function resetModifications() {
  modifications = [];
  modHistory = [];
  localStorage.removeItem('wf_mods');
  localStorage.removeItem('wf_history');
}

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function empName(code) { return EMPLOYEES[code]?.name || code; }
function empRole(code) { return EMPLOYEES[code]?.role || ''; }
function empColor(code) { return EMPLOYEES[code]?.color || '#888'; }

function nameList(codes) {
  if (!codes || codes.length === 0) return '—';
  return codes.map(c => empName(c)).join(', ');
}

function isoDate(y, m, d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function todayISO() {
  const t = new Date();
  // Allow browsing Nov/Dec 2026
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const days = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${days[d.getDay()]}, ${d.getDate()} de ${months[d.getMonth()]} de ${d.getFullYear()}`;
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const days = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}

function getEmployeeStatusOnDate(empCode, dateStr) {
  const sched = getSchedule(dateStr);
  if (!sched) return { status: 'no-data', label: 'Sin información', sede: null };
  if (sched.noData) return { status: 'no-data', label: 'Sin planificación registrada', sede: null };
  if (sched.holiday) return { status: 'holiday', label: 'Día no laborable', sede: null };

  const inPCV = sched.pcvC === empCode || (sched.pcvCArr || []).includes(empCode) || (sched.pcvB || []).includes(empCode)
              || (sched.pcvCExtra || []).includes(empCode);
  const bcCArr = sched.bcCArr || (sched.bcC ? [sched.bcC] : []);
  const inBC  = bcCArr.includes(empCode) || (sched.bcB  || []).includes(empCode);
  const isFree = (sched.freeC || []).includes(empCode) || (sched.freeB || []).includes(empCode);
  const isExtra = (sched.extra || []).includes(empCode);

  if (inPCV && inBC) return { status: 'conflict', label: 'Doble asignación', sede: 'PCV y BC' };
  if ((inPCV || inBC) && isFree) return { status: 'conflict', label: 'Trabajo y libre simultáneamente', sede: inPCV ? 'PCV' : 'BC' };
  if (inPCV) return { status: 'work', label: isExtra ? 'Día libre trabajado (pago extra)' : 'Trabaja hoy', sede: 'Parque Cerro Verde', extra: isExtra };
  if (inBC)  return { status: 'work', label: isExtra ? 'Día libre trabajado (pago extra)' : 'Trabaja hoy', sede: 'Bello Campo', extra: isExtra };
  if (isFree) return { status: 'off', label: 'Día libre registrado', sede: null };
  return { status: 'no-data', label: 'Sin información confirmada', sede: null };
}

function getConflicts(dateStr) {
  const sched = getSchedule(dateStr);
  const base = sched?.conflicts ? [...sched.conflicts] : [];

  // Detección dinámica: BC cerrado los sábados desde el 14/11
  if (sched && !sched.noData && !sched.holiday && dateStr >= '2026-11-14') {
    const d = new Date(dateStr + 'T12:00:00');
    if (d.getDay() === 6) {
      const bcCArrChk = sched.bcCArr || (sched.bcC ? [sched.bcC] : []);
      const hasBC = bcCArrChk.length > 0 || (sched.bcB && sched.bcB.length > 0);
      const alreadyFlagged = base.some(c => c.type === 'DIA_NO_LABORABLE');
      if (hasBC && !alreadyFlagged) {
        base.push({ type:'DIA_NO_LABORABLE', severity:'critical',
          msg:`BC cerrado los sábados desde el 14/11. Asignación de ${dateStr} en BC es inválida.` });
      }
    }
  }

  // Detección dinámica: Samuel (B2) y Maikol (B4) en la misma sede
  if (sched && !sched.noData && !sched.holiday) {
    const pcvB = sched.pcvB || [];
    const bcB  = sched.bcB  || [];
    const b2pcv = pcvB.includes('B2'), b4pcv = pcvB.includes('B4');
    const b2bc  = bcB.includes('B2'),  b4bc  = bcB.includes('B4');
    const alreadyFlagged = base.some(c => c.type === 'COINCIDENCIA_B2_B4');
    if (!sched._apertura && !alreadyFlagged && ((b2pcv && b4pcv) || (b2bc && b4bc))) {
      const sede = (b2pcv && b4pcv) ? 'PCV' : 'BC';
      base.push({ type:'COINCIDENCIA_B2_B4', severity:'critical', emp:['B2','B4'],
        msg:`Samuel (B2) y Maikol (B4) coinciden en ${sede} el ${dateStr}. Según indicación administrativa, no deben coincidir en la misma sede.` });
    }
  }

  return base;
}

function getAllConflicts() {
  return Object.entries(RAW_SCHEDULE)
    .filter(([d, s]) => s.conflicts && s.conflicts.length)
    .map(([d, s]) => ({ date: d, conflicts: s.conflicts }));
}

// Siguiente jornada
function nextWorkDay(empCode, fromDate) {
  const dates = Object.keys(RAW_SCHEDULE).sort();
  for (const d of dates) {
    if (d <= fromDate) continue;
    const st = getEmployeeStatusOnDate(empCode, d);
    if (st.status === 'work') return d;
  }
  return null;
}

function nextOffDay(empCode, fromDate) {
  const dates = Object.keys(RAW_SCHEDULE).sort();
  for (const d of dates) {
    if (d <= fromDate) continue;
    const st = getEmployeeStatusOnDate(empCode, d);
    if (st.status === 'off') return d;
  }
  return null;
}

function countWorkDays(empCode, month) {
  return Object.keys(RAW_SCHEDULE)
    .filter(d => d.startsWith(month))
    .filter(d => {
      const st = getEmployeeStatusOnDate(empCode, d);
      return st.status === 'work';
    }).length;
}

let state = {

  selectedEmployee: null,

  calSelectedDate: null,
  teamFilter: 'all' // all | cajera | barista
};

// Fecha de hoy en tiempo real (zona horaria local del dispositivo)
function getTodayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const REF_TODAY = getTodayISO();

// ═══════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════
const ADMIN_PASS = 'Alidaygaby*2026';

function navigate(page) {
  if (page === 'admin' && !state.adminUnlocked) {
    showAdminLock();
    return;
  }
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('nav-' + page).classList.add('active');
  state.currentPage = page;
  renderPage(page);
}

function showAdminLock() {
  const overlay = document.createElement('div');
  overlay.id = 'admin-lock-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `
    <div style="background:var(--surface);border-radius:16px;padding:28px 24px;width:100%;max-width:320px;text-align:center">
      <div style="font-size:36px;margin-bottom:8px">🔒</div>
      <div style="font-size:17px;font-weight:700;margin-bottom:4px">Acceso restringido</div>
      <div style="font-size:13px;color:var(--text-sec);margin-bottom:18px">Ingresa la contraseña de administrador</div>
      <input id="admin-pass-input" type="password" placeholder="Contraseña"
        style="width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:15px;font-family:inherit;background:var(--surface2);color:var(--text);margin-bottom:8px"
        onkeydown="if(event.key==='Enter')checkAdminPass()" />
      <div id="admin-pass-err" style="color:#ef4444;font-size:12px;margin-bottom:8px;min-height:16px"></div>
      <div style="display:flex;gap:8px">
        <button onclick="document.getElementById('admin-lock-overlay').remove()"
          style="flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;background:none;cursor:pointer;font-size:14px;color:var(--text-sec)">Cancelar</button>
        <button onclick="checkAdminPass()"
          style="flex:1;padding:10px;border:none;border-radius:8px;background:var(--green);color:#fff;cursor:pointer;font-size:14px;font-weight:600">Entrar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(() => document.getElementById('admin-pass-input')?.focus(), 100);
}

function checkAdminPass() {
  const val = document.getElementById('admin-pass-input')?.value || '';
  if (val === ADMIN_PASS) {
    state.adminUnlocked = true;
    document.getElementById('admin-lock-overlay')?.remove();
    navigate('admin');
  } else {
    document.getElementById('admin-pass-err').textContent = 'Contraseña incorrecta';
    document.getElementById('admin-pass-input').value = '';
    document.getElementById('admin-pass-input').focus();
  }
}

function renderPage(page) {
  const p = document.getElementById('page-' + page);
  if (page === 'home') renderHome(p);
  else if (page === 'calendar') renderCalendar(p);
  else if (page === 'team') renderTeam(p);
  else if (page === 'venues') renderVenues(p);
  else if (page === 'admin') renderAdmin(p);
}

function renderHome(container) {
  const today = REF_TODAY;
  const selEmp = state.selectedEmployee;
  const viewDate = state.homeDate || today;

  // Selector compacto desplegable
  let html = `
  <div style="margin-bottom:14px">
    <label style="display:block;font-size:12px;font-weight:600;color:var(--text-sec);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">👤 Seleccionar empleado</label>
    <select onchange="selectEmployee(this.value)" style="width:100%;padding:10px 12px;font-size:15px;font-weight:600;border:2px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer;appearance:auto">
      <option value="">— Elige un empleado —</option>`;
  Object.entries(EMPLOYEES).forEach(([code, emp]) => {
    const sel = selEmp === code ? 'selected' : '';
    html += `<option value="${code}" ${sel}>${emp.name} · ${emp.role}</option>`;
  });
  html += `</select></div>`;

  // Selector de fecha
  html += `<div class="date-selector">
    <button class="btn btn-green" onclick="setHomeDate('${today}')">Hoy</button>
    <input type="date" id="home-date-input" value="${viewDate}" min="2026-11-01" max="2027-02-28"
      onchange="setHomeDate(this.value)" style="font-size:13px">
  </div>`;

  if (selEmp) {
    const emp = EMPLOYEES[selEmp];
    const st = getEmployeeStatusOnDate(selEmp, viewDate);
    const sched = getSchedule(viewDate);
    const conflicts = sched?.conflicts || [];
    const special = SPECIAL_HOURS[viewDate];

    // Status card
    let cardClass = 'status-unknown';
    let icon = '❓';
    if (st.status === 'work') { cardClass = st.extra ? 'status-conflict' : 'status-work'; icon = st.extra ? '💰' : '✅'; }
    else if (st.status === 'off') { cardClass = 'status-off'; icon = '🌙'; }
    else if (st.status === 'conflict') { cardClass = 'status-conflict'; icon = '⚠️'; }
    else if (st.status === 'holiday') { cardClass = 'status-holiday'; icon = '🎄'; }
    else if (st.status === 'no-data' && sched?.noData) { icon = '📋'; }

    html += `<div class="status-card ${cardClass}">
      <div style="font-size:13px;color:#64748B;margin-bottom:4px">${formatDate(viewDate)}</div>
      <div class="status-title">${icon} ${st.label}</div>`;

    if (st.status === 'work' && st.sede) {
      const hours = st.sede.includes('PCV') || st.sede.includes('Cerro') ? getPCVHours(viewDate) : getBCHours(viewDate);
      html += `<div class="detail-row"><span class="detail-label">Sede</span><span class="detail-value">${st.sede}</span></div>`;
      html += `<div class="detail-row"><span class="detail-label">Cargo</span><span class="detail-value">${emp.role}</span></div>`;
      if (hours) html += `<div class="detail-row"><span class="detail-label">Horario</span><span class="detail-value">${hours}</span></div>`;
      if (special?.event) html += `<div class="detail-row"><span class="detail-label">Evento</span><span class="detail-value">🎉 ${special.event}</span></div>`;

      // Compañeros
      if (sched && st.sede.includes('Cerro')) {
        const comps = [...(sched.pcvB||[]).filter(c=>c!==selEmp), sched.pcvC !== selEmp ? sched.pcvC : null].filter(Boolean);
        if (comps.length) html += `<div class="detail-row"><span class="detail-label">Compañeros</span><span class="detail-value">${nameList(comps)}</span></div>`;
      } else if (sched && st.sede.includes('Bello')) {
        const bcCArrComp = sched.bcCArr || (sched.bcC ? [sched.bcC] : []);
        const comps = [...(sched.bcB||[]).filter(c=>c!==selEmp), ...bcCArrComp.filter(c=>c!==selEmp)];
        if (comps.length) html += `<div class="detail-row"><span class="detail-label">Compañeros</span><span class="detail-value">${nameList(comps)}</span></div>`;
      }
    } else if (st.status === 'conflict') {
      if (conflicts.length) {
        html += `<div class="detail-row"><span class="detail-label">⚠️ Alerta</span><span class="detail-value" style="color:#DC2626">${conflicts.map(c=>c.msg).join(' ')}</span></div>`;
      }
    }

    html += `</div>`;

    // Próximas jornadas
    const nextWork = nextWorkDay(selEmp, viewDate);
    const nextOff  = nextOffDay(selEmp, viewDate);
    let nextWorkLabel = '—';
    if (nextWork) {
      const nwSt = getEmployeeStatusOnDate(selEmp, nextWork);
      const sedeTag = nwSt.sede ? ` · <span style="font-size:12px;font-weight:400;color:#64748B">${nwSt.sede.includes('Cerro') ? 'PCV' : 'BC'}</span>` : '';
      nextWorkLabel = formatDateShort(nextWork) + sedeTag;
    }
    html += `<div class="card">
      <div class="section-title">Próximamente</div>
      <div class="daily-row" style="margin:4px 0;padding:6px 0">
        <span class="daily-row-label">Próxima jornada</span>
        <span class="daily-row-value">${nextWorkLabel}</span>
      </div>
      <div class="daily-row" style="margin:4px 0;padding:6px 0">
        <span class="daily-row-label">Próximo descanso</span>
        <span class="daily-row-value">${nextOff ? formatDateShort(nextOff) : '—'}</span>
      </div>
    </div>`;

    // Resumen semanal
    html += renderWeeklySummaryForEmployee(selEmp, viewDate);

  } else {
    // Alertas globales
    const allConflicts = getAllConflicts();
    if (allConflicts.length) {
      html += `<div class="section-title">⚠️ Alertas del calendario</div>`;
      allConflicts.slice(0,4).forEach(({date, conflicts}) => {
        conflicts.forEach(c => {
          const cls = c.severity === 'critical' ? 'alert-red' : 'alert-orange';
          html += `<div class="alert ${cls}"><span class="alert-icon">${c.severity==='critical'?'🔴':'🟡'}</span>
            <div><strong>${formatDateShort(date)}</strong><p>${c.msg}</p></div></div>`;
        });
      });
      if (allConflicts.length > 4) {
        html += `<button class="btn btn-outline" onclick="navigate('admin')" style="width:100%;justify-content:center;margin-top:4px">Ver todas las alertas (${allConflicts.reduce((s,a)=>s+a.conflicts.length,0)})</button>`;
      }
    }

    // Día seleccionado (o hoy)
    const todaySched = getSchedule(viewDate);
    if (todaySched && !todaySched.noData) {
      html += `<div class="section-title" style="margin-top:14px">📅 ${formatDate(viewDate)}</div>`;
      html += renderDayCards(viewDate, true);
    }

    // Día siguiente
    const allDates = Object.keys(RAW_SCHEDULE).sort();
    const nextDateHome = allDates.find(d => d > viewDate) || null;
    if (nextDateHome) {
      const nextSchedHome = getSchedule(nextDateHome);
      if (nextSchedHome && !nextSchedHome.noData) {
        html += `<div class="section-title" style="margin-top:20px">📅 ${formatDate(nextDateHome)}</div>`;
        html += renderDayCards(nextDateHome, false);
      }
    }
  }

  container.innerHTML = html;
}

function setHomeDate(d) {
  state.homeDate = d;
  renderPage('home');
}

function selectEmployee(code) {
  state.selectedEmployee = code || null;
  state.homeDate = state.homeDate || REF_TODAY;
  renderPage('home');
}

function renderWeeklySummaryForEmployee(empCode, fromDate) {
  const d = new Date(fromDate + 'T12:00:00');
  const dow = d.getDay();
  const weekStart = new Date(d);
  weekStart.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));

  let html = `<div class="section-title">Resumen semanal</div>
  <div class="card-sm" style="padding:10px">`;
  const days = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  for (let i = 0; i < 7; i++) {
    const cur = new Date(weekStart);
    cur.setDate(weekStart.getDate() + i);
    const ds = isoDate(cur.getFullYear(), cur.getMonth()+1, cur.getDate());
    const st = getEmployeeStatusOnDate(empCode, ds);
    const isToday = ds === fromDate;
    let dot = '⬜';
    if (st.status === 'work') dot = '<span style="color:var(--green)">●</span>';
    else if (st.status === 'off') dot = '<span style="color:#94A3B8">○</span>';
    else if (st.status === 'conflict') dot = '<span style="color:var(--red)">▲</span>';
    else if (st.status === 'holiday') dot = '<span style="color:#EF4444">✕</span>';

    html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 6px;border-radius:6px;${isToday?'background:var(--green-light);font-weight:600':''}">
      <span style="font-size:12px">${days[i]} ${cur.getDate()}</span>
      <span style="font-size:11px;color:var(--text-sec)">${st.label}</span>
      <span>${dot}</span>
    </div>`;
  }
  html += `</div>`;
  return html;
}

function renderMonthly(year, month, selEmp) {
  const monthNames = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const MONTHS_ORDER = [{y:2026,m:11},{y:2026,m:12},{y:2027,m:1},{y:2027,m:2}];
  const curIdx = MONTHS_ORDER.findIndex(x => x.y === year && x.m === month);
  const prevEntry = curIdx > 0 ? MONTHS_ORDER[curIdx-1] : null;
  const nextEntry = curIdx < MONTHS_ORDER.length-1 ? MONTHS_ORDER[curIdx+1] : null;

  const html_prev = prevEntry
    ? `<button onclick="setCalMonth(${prevEntry.y},${prevEntry.m})">‹</button>`
    : `<button style="visibility:hidden">‹</button>`;
  const html_next = nextEntry
    ? `<button onclick="setCalMonth(${nextEntry.y},${nextEntry.m})">›</button>`
    : `<button style="visibility:hidden">›</button>`;

  let html = `<div class="cal-nav">
    ${html_prev}
    <div style="text-align:center">
      <h2 style="font-size:16px;font-weight:700">${monthNames[month]} ${year}</h2>
    </div>
    ${html_next}
  </div>`;

  const daysInMonth = new Date(year, month, 0).getDate();

  // Helper chip for monthly view
  function monthDayChip(code, ds) {
    const sched = getSchedule(ds);
    const isToday = ds === REF_TODAY;
    const todayCls = isToday ? ' chip-today' : '';
    if (!sched || sched.noData) return { cls:'chip-nd'+todayCls, lbl:'?' };
    if (sched.holiday) return { cls:'chip-holiday'+todayCls, lbl:'🎄' };
    const st = getEmployeeStatusOnDate(code, ds);
    if (st.status === 'off') return { cls:'chip-libre'+todayCls, lbl:String(new Date(ds+'T12:00:00').getDate()) };
    if (st.status === 'work') {
      const isBC = st.sede && st.sede.includes('Bello');
      const lbl = String(new Date(ds+'T12:00:00').getDate());
      return { cls:(isBC ? 'chip-bc' : 'chip-pcv')+todayCls, lbl };
    }
    return { cls:'chip-nd'+todayCls, lbl:String(new Date(ds+'T12:00:00').getDate()) };
  }

  // Legend
  html += `<div class="ec-legend">
    <span class="ec-legend-item"><span class="ec-legend-dot" style="background:#DBEAFE"></span>Bello Campo</span>
    <span class="ec-legend-item"><span class="ec-legend-dot" style="background:#D1FAE5"></span>PCV</span>
    <span class="ec-legend-item"><span class="ec-legend-dot" style="background:#FEF9C3"></span>Libre</span>
  </div>`;

  const empList = selEmp ? [[selEmp, EMPLOYEES[selEmp]]] : Object.entries(EMPLOYEES);
  const isLarge = !!selEmp; // modo grande cuando hay 1 empleado seleccionado

  const gridCls = isLarge ? 'ec-grid' : 'ec-grid';
  const dowCls = isLarge ? 'ec-month-dow-lg' : 'ec-month-dow';
  const dowLblCls = isLarge ? 'ec-month-dow-label-lg' : 'ec-month-dow-label';
  const daysCls = isLarge ? 'ec-month-days-lg' : 'ec-month-days';
  const chipCls = isLarge ? 'ec-month-chip-lg' : 'ec-month-chip';
  const emptyCls = isLarge ? 'ec-month-empty-lg' : 'ec-month-empty';

  html += `<div class="${gridCls}">`;
  empList.forEach(([code, emp]) => {
    const initials = emp.name.substring(0,2).toUpperCase();
    const isFija = code === 'C1';
    // Count work days this month
    let bcCount = 0, pcvCount = 0, libreCount = 0;
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = isoDate(year, month, d);
      const sched = getSchedule(ds);
      if (!sched || sched.noData || sched.holiday) continue;
      const st = getEmployeeStatusOnDate(code, ds);
      if (st.status === 'off') libreCount++;
      else if (st.status === 'work') {
        if (st.sede && st.sede.includes('Bello')) bcCount++;
        else pcvCount++;
      }
    }

    const badgeSz = isLarge ? '12px' : '9px';
    const badgePad = isLarge ? '4px 10px' : '2px 6px';
    html += `<div class="ec-card">
      <div class="ec-header">
        <div class="ec-avatar" style="background:${emp.color};${isLarge?'width:52px;height:52px;font-size:18px':''}">${initials}</div>
        <div>
          <div class="ec-name" style="${isLarge?'font-size:17px':''}">${emp.name}</div>
          <div class="ec-role" style="${isLarge?'font-size:13px':''}">${emp.role}${isFija ? ' · fija BC' : ' · rota'}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:${isLarge?'12px':'8px'}">
        <span style="font-size:${badgeSz};background:#DBEAFE;color:#1D4ED8;padding:${badgePad};border-radius:8px;font-weight:700">BC ${bcCount}</span>
        <span style="font-size:${badgeSz};background:#D1FAE5;color:#065F46;padding:${badgePad};border-radius:8px;font-weight:700">PCV ${pcvCount}</span>
        <span style="font-size:${badgeSz};background:#FEF9C3;color:#854D0E;padding:${badgePad};border-radius:8px;font-weight:700">L ${libreCount}</span>
      </div>
      <div class="${dowCls}">
        <div class="${dowLblCls}">L</div>
        <div class="${dowLblCls}">M</div>
        <div class="${dowLblCls}">X</div>
        <div class="${dowLblCls}">J</div>
        <div class="${dowLblCls}">V</div>
        <div class="${dowLblCls}">S</div>
        <div class="${dowLblCls}">D</div>
      </div>
      <div class="${daysCls}">`;

    // Calculate day of week for first of month (0=Mon...6=Sun)
    const firstDow = (new Date(year, month-1, 1).getDay() + 6) % 7; // convert Sun=0 to Mon=0
    for (let pad = 0; pad < firstDow; pad++) {
      html += `<div class="${emptyCls}"></div>`;
    }
    for (let day = 1; day <= daysInMonth; day++) {
      const ds = isoDate(year, month, day);
      const { cls, lbl } = monthDayChip(code, ds);
      html += `<div class="${chipCls} ${cls}" onclick="openDayDetail('${ds}')" title="${ds}">${lbl}</div>`;
    }
    html += `</div></div>`;
  });
  html += `</div>`;

  // Selected day detail
  if (state.calSelectedDate && state.calSelectedDate.startsWith(`${year}-${String(month).padStart(2,'0')}`)) {
    html += `<div style="margin-top:14px"><div class="section-title">📅 ${formatDate(state.calSelectedDate)}</div>`;
    html += renderDayCards(state.calSelectedDate, true);
    html += `</div>`;
  }

  return html;
}

function setCalMonth(year, month) {
  const mm = String(month).padStart(2,'0');
  state.calViewDate = `${year}-${mm}-01`;
  renderPage('calendar');
}

function openDayDetail(dateStr) {
  state.calSelectedDate = dateStr;
  if (state.calView === 'monthly') renderPage('calendar');
  else {
    state.calView = 'daily';
    renderPage('calendar');
  }
}

function renderWeekly(fromDate, selEmp) {
  const d = new Date(fromDate + 'T12:00:00');
  const dow = d.getDay();
  const weekStart = new Date(d);
  weekStart.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);

  const fmtShort = (dt) => {
    const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return `${dt.getDate()} ${months[dt.getMonth()]}`;
  };

  // Collect the 7 dates of this week
  const weekDates = [];
  for (let i = 0; i < 7; i++) {
    const cur = new Date(weekStart);
    cur.setDate(weekStart.getDate() + i);
    weekDates.push(isoDate(cur.getFullYear(), cur.getMonth()+1, cur.getDate()));
  }

  const dayLabels = ['J','V','S','D','L','M','X'];

  let html = `<div class="cal-nav">
    <button onclick="shiftWeek(-1)">‹</button>
    <div style="text-align:center">
      <h2 style="font-size:14px;font-weight:700">${fmtShort(weekStart)} – ${fmtShort(weekEnd)}</h2>
      <div style="font-size:10px;color:var(--text-sec)">Ciclo activo</div>
    </div>
    <button onclick="shiftWeek(1)">›</button>
  </div>`;

  // Legend
  html += `<div class="ec-legend">
    <span class="ec-legend-item"><span class="ec-legend-dot" style="background:#DBEAFE"></span>Bello Campo</span>
    <span class="ec-legend-item"><span class="ec-legend-dot" style="background:#D1FAE5"></span>PCV</span>
    <span class="ec-legend-item"><span class="ec-legend-dot" style="background:#FEF9C3"></span>Libre</span>
  </div>`;

  // Helper: get chip class and label for a date+employee
  function empDayChip(code, ds) {
    const sched = getSchedule(ds);
    const isToday = ds === REF_TODAY;
    const todayCls = isToday ? ' chip-today' : '';
    if (!sched || sched.noData) return { cls:'chip-nd'+todayCls, lbl:'?' };
    if (sched.holiday) return { cls:'chip-holiday'+todayCls, lbl:'🎄' };
    const st = getEmployeeStatusOnDate(code, ds);
    if (st.status === 'off') return { cls:'chip-libre'+todayCls, lbl:'L' };
    if (st.status === 'work') {
      const isBC = st.sede && st.sede.includes('Bello');
      return { cls:(isBC ? 'chip-bc' : 'chip-pcv')+todayCls, lbl: isBC ? 'BC' : 'PCV' };
    }
    return { cls:'chip-nd'+todayCls, lbl:'?' };
  }

  // Filter: if selEmp show only that employee, else all
  const empList = selEmp ? [[selEmp, EMPLOYEES[selEmp]]] : Object.entries(EMPLOYEES);

  html += `<div class="ec-grid">`;
  empList.forEach(([code, emp]) => {
    const initials = emp.name.substring(0,2).toUpperCase();
    const isFija = code === 'C1';
    html += `<div class="ec-card">
      <div class="ec-header">
        <div class="ec-avatar" style="background:${emp.color}">${initials}</div>
        <div>
          <div class="ec-name">${emp.name}</div>
          <div class="ec-role">${emp.role}${isFija ? ' · fija BC' : ' · rota'}</div>
        </div>
      </div>
      <div class="ec-days-row">`;
    weekDates.forEach((ds, i) => {
      const { cls, lbl } = empDayChip(code, ds);
      html += `<div class="ec-day-col">
        <span class="ec-day-label">${dayLabels[i]}</span>
        <div class="ec-day-chip ${cls}" onclick="openDayDetail('${ds}')" title="${ds}">${lbl}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;

  // If a day is selected, show detail below
  if (state.calSelectedDate && weekDates.includes(state.calSelectedDate)) {
    html += `<div style="margin-top:14px"><div class="section-title">📅 ${formatDate(state.calSelectedDate)}</div>`;
    html += renderDayCards(state.calSelectedDate, true);
    html += `</div>`;
  }

  return html;
}

function shiftWeek(dir) {
  const d = new Date((state.calSelectedDate || REF_TODAY) + 'T12:00:00');
  d.setDate(d.getDate() + dir * 7);
  state.calSelectedDate = isoDate(d.getFullYear(), d.getMonth()+1, d.getDate());
  renderPage('calendar');
}

function renderDailyView(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  let html = `<div class="cal-nav">
    <button onclick="shiftDay(-1)">‹</button>
    <h2 style="font-size:14px;text-transform:capitalize">${formatDateShort(dateStr)}</h2>
    <button onclick="shiftDay(1)">›</button>
  </div>`;
  html += renderDayCards(dateStr, true);
  return html;
}

function shiftDay(dir) {
  const d = new Date((state.calSelectedDate || REF_TODAY) + 'T12:00:00');
  d.setDate(d.getDate() + dir);
  const ds = isoDate(d.getFullYear(), d.getMonth()+1, d.getDate());
  if (ds >= '2026-11-01' && ds <= '2027-02-28') {
    state.calSelectedDate = ds;
    renderPage('calendar');
  }
}

// Helper global: render una burbuja de empleado (Bubbles & Chips design)
function empBubble(code, isExtra) {
  const emp = EMPLOYEES[code];
  if (!emp) return '';
  const initials = emp.name.substring(0,2).toUpperCase();
  const roleChip = emp.role === 'Cajera'
    ? `<span class="bc-role-chip bc-role-cajera">Cajera</span>`
    : `<span class="bc-role-chip bc-role-barista">Barista</span>`;
  const badge = isExtra
    ? `<span class="bc-badge-rota" style="background:#F59E0B;color:#fff">💰 Extra</span>`
    : code === 'C1'
    ? `<span class="bc-badge-fija">Fija</span>`
    : `<span class="bc-badge-rota">Rota</span>`;
  return `<div class="bc-bubble">
    <div class="bc-avatar" style="background:${emp.color}">${initials}</div>
    <div>
      <div class="bc-bubble-name">${emp.name}${badge}</div>
      <div>${roleChip}</div>
    </div>
  </div>`;
}

// Helper global: render burbuja pequeña de descanso
function restBubble(code) {
  const emp = EMPLOYEES[code];
  if (!emp) return '';
  const initials = emp.name.substring(0,2).toUpperCase();
  return `<div class="bc-rest-item">
    <div class="bc-rest-avatar" style="background:${emp.color}" title="${emp.name}">${initials}</div>
    <span class="bc-rest-name">${emp.name}</span>
  </div>`;
}

function renderDayCards(dateStr, showConflicts) {
  const sched = getSchedule(dateStr);
  if (!sched) return `<div class="card-sm"><p style="color:var(--text-sec);font-size:13px">Sin datos para esta fecha.</p></div>`;
  if (sched.noData) return `<div class="card-sm"><p style="color:var(--text-sec);font-size:13px">Sin planificación registrada (1-12 noviembre).</p></div>`;
  if (sched.holiday) return `<div class="bc-day-wrap" style="text-align:center;padding:24px 16px"><div style="font-size:40px;margin-bottom:10px">🎄</div><p style="font-weight:700;color:var(--red);font-size:15px">Día no laborable</p></div>`;

  const pcvH = getPCVHours(dateStr);
  const bcH = getBCHours(dateStr);
  const special = SPECIAL_HOURS[dateStr];
  const bcCArrDisp = sched.bcCArr || (sched.bcC ? [sched.bcC] : []);
  const bcClosed = bcH === null;

  // Recopilar todos los que descansan
  const freeAll = [...(sched.freeC||[]), ...(sched.freeB||[])];

  // Verificar cobertura
  const conflicts = showConflicts ? (sched.conflicts || []) : [];
  const hasCritical = conflicts.some(c => c.severity === 'critical');
  const hasWarn = conflicts.length > 0 && !hasCritical;
  const statusChip = hasCritical
    ? `<span class="bc-status-chip bc-status-warn">⚠️ Revisar</span>`
    : hasWarn
    ? `<span class="bc-status-chip" style="background:#FEF3C7;color:#92400E">⚡ Aviso</span>`
    : `<span class="bc-status-chip bc-status-ok">✓ Cubierto</span>`;

  let html = `<div class="bc-day-wrap">`;

  // Fila superior: estado
  const dayLabel = formatDateShort(dateStr);
  html += `<div class="bc-status-row">
    <span class="bc-date-label">📅 ${dayLabel}</span>
    ${statusChip}
  </div>`;

  if (sched._apertura) {
    html += `<div style="text-align:center;margin-bottom:10px;padding:8px 12px;background:linear-gradient(135deg,#059669,#0284C7);border-radius:10px;font-size:12px;font-weight:700;color:#fff">🎉 APERTURA OFICIAL — Todo el personal presente</div>`;
  }
  if (special?.event) {
    html += `<div style="text-align:center;margin-bottom:10px;padding:6px;background:#FEF3C7;border-radius:10px;font-size:12px;font-weight:600;color:#92400E">🎉 ${special.event}</div>`;
  }

  // Dos columnas de sedes
  html += `<div class="bc-venues-row">`;

  // ── Columna PCV ──
  html += `<div class="bc-venue-col bc-venue-pcv">
    <div class="bc-venue-header">
      <span class="bc-venue-tag tag-pcv">PCV</span>
      <span class="bc-venue-hours">${pcvH || '—'}</span>
    </div>`;

  const extraSet = new Set(sched.extra || []);
  if (sched.pcvC) {
    html += `<div class="bc-section-label">Cajera</div><div class="bc-bubbles">${empBubble(sched.pcvC, extraSet.has(sched.pcvC))}</div>`;
  }
  // pcvCExtra: cajeras extra (libre trabajado) en PCV
  if ((sched.pcvCExtra||[]).length) {
    html += `<div class="bc-section-label" style="color:#F59E0B">Cajera extra (libre trabajado)</div><div class="bc-bubbles">`;
    (sched.pcvCExtra||[]).forEach(c => { html += empBubble(c, true); });
    html += `</div>`;
  }
  if ((sched.pcvB||[]).length) {
    html += `<div class="bc-section-label">Baristas</div><div class="bc-bubbles">`;
    (sched.pcvB||[]).forEach(c => { html += empBubble(c, extraSet.has(c)); });
    html += `</div>`;
  }
  if (!sched.pcvC && !(sched.pcvCExtra||[]).length && !(sched.pcvB||[]).length) {
    html += `<p style="font-size:11px;color:var(--text-sec);margin-top:8px">Sin asignación</p>`;
  }
  html += `</div>`; // end pcv col

  // ── Columna BC ──
  html += `<div class="bc-venue-col ${bcClosed ? 'bc-venue-closed' : 'bc-venue-bc'}">
    <div class="bc-venue-header">
      <span class="bc-venue-tag tag-bc">BC</span>
      <span class="bc-venue-hours">${bcClosed ? 'Cerrado' : (bcH || '—')}</span>
    </div>`;

  if (bcClosed) {
    html += `<p style="font-size:11px;color:var(--text-sec);margin-top:8px;text-align:center">🔒 No opera hoy</p>`;
  } else {
    if (bcCArrDisp.length) {
      html += `<div class="bc-section-label">Cajera${bcCArrDisp.length>1?'s':''}</div><div class="bc-bubbles">`;
      bcCArrDisp.forEach(c => { html += empBubble(c, extraSet.has(c)); });
      html += `</div>`;
    }
    if ((sched.bcB||[]).length) {
      html += `<div class="bc-section-label">Barista${(sched.bcB||[]).length>1?'s':''}</div><div class="bc-bubbles">`;
      (sched.bcB||[]).forEach(c => { html += empBubble(c, extraSet.has(c)); });
      html += `</div>`;
    }
    if (!bcCArrDisp.length && !(sched.bcB||[]).length) {
      html += `<p style="font-size:11px;color:var(--text-sec);margin-top:8px">Sin asignación</p>`;
    }
  }
  html += `</div>`; // end bc col
  html += `</div>`; // end venues-row

  // ── Descansan hoy ──
  if (freeAll.length) {
    html += `<div class="bc-rest-section">
      <div class="bc-rest-label">😴 Descansan hoy</div>
      <div class="bc-rest-bubbles">`;
    freeAll.forEach(c => { html += restBubble(c); });
    html += `</div></div>`;
  }

  html += `</div>`; // end bc-day-wrap

  // ── Alertas ──
  if (showConflicts) {
    conflicts.forEach(c => {
      const cls = c.severity === 'critical' ? 'alert-red' : 'alert-orange';
      html += `<div class="alert ${cls}"><span class="alert-icon">${c.severity==='critical'?'🔴':'🟡'}</span>
        <div><strong>Alerta: ${c.type.replace(/_/g,' ')}</strong><p>${c.msg}</p></div></div>`;
    });
    if (sched._modified) html += `<div class="alert alert-yellow"><span class="alert-icon">✏️</span><p>Este día tiene modificaciones administrativas.</p></div>`;
  }

  return html;
}

function renderTeam(container) {
  const filter = state.teamFilter || 'all';
  const viewDate = REF_TODAY;
  const curMonth = state.calViewDate?.substring(0,7) || '2026-11';

  let html = `<div class="filter-row">
    <button class="filter-chip ${filter==='all'?'active':''}" onclick="state.teamFilter='all';renderPage('team')">Todos</button>
    <button class="filter-chip ${filter==='cajera'?'active':''}" onclick="state.teamFilter='cajera';renderPage('team')">Cajeras</button>
    <button class="filter-chip ${filter==='barista'?'active':''}" onclick="state.teamFilter='barista';renderPage('team')">Baristas</button>
  </div>`;

  html += `<div class="team-grid">`;
  Object.entries(EMPLOYEES).forEach(([code, emp]) => {
    if (filter === 'cajera' && emp.role !== 'Cajera') return;
    if (filter === 'barista' && emp.role !== 'Barista') return;

    const st = getEmployeeStatusOnDate(code, viewDate);
    const workdays = countWorkDays(code, curMonth);
    const hasConflict = getAllConflicts().some(a => a.conflicts.some(c => c.emp === code));
    const nextWork = nextWorkDay(code, viewDate);

    let statusBadge = '';
    if (st.status === 'work') statusBadge = `<span class="chip chip-green" style="font-size:9px">Hoy: ${st.sede?.split(' ')[0]}</span>`;
    else if (st.status === 'off') statusBadge = `<span class="chip chip-blue" style="font-size:9px">Libre hoy</span>`;
    else if (st.status === 'conflict') statusBadge = `<span class="chip chip-red" style="font-size:9px">⚠️ Conflicto</span>`;
    else statusBadge = `<span class="chip chip-gray" style="font-size:9px">Sin info</span>`;

    html += `<div class="team-card" onclick="openEmployeeDetail('${code}')">
      <div class="team-avatar" style="background:${emp.color}">${emp.name.substring(0,2).toUpperCase()}</div>
      <div class="team-name">${emp.name}</div>
      <div class="team-role">${emp.role}</div>
      <div class="team-stats">
        ${statusBadge}
        <span class="chip chip-gray" style="font-size:9px">${workdays} días/${curMonth.includes('11')?'nov':'dic'}</span>
        ${hasConflict ? `<span class="chip chip-red" style="font-size:9px">⚠️</span>` : ''}
      </div>
      <div style="margin-top:8px;font-size:11px;color:var(--text-sec)">
        Próx. jornada: ${nextWork ? formatDateShort(nextWork) : '—'}
      </div>
    </div>`;
  });
  html += `</div>`;
  container.innerHTML = html;
}

function openEmployeeDetail(code) {
  state.selectedEmployee = code;
  state.homeDate = REF_TODAY;
  navigate('home');
}

    <button class="view-tab ${tab==='conflicts'?'active':''}" onclick="state.adminTab='conflicts';renderPage('admin')">Alertas</button>
    <button class="view-tab ${tab==='schedule'?'active':''}" onclick="state.adminTab='schedule';renderPage('admin')">Horarios</button>
    <button class="view-tab ${tab==='history'?'active':''}" onclick="state.adminTab='history';renderPage('admin')">Historial</button>
    <button class="view-tab ${tab==='empleados'?'active':''}" onclick="state.adminTab='empleados';renderPage('admin')">Empleados</button>
  </div>`;

  if (tab === 'conflicts') html += renderAdminConflicts();
  else if (tab === 'schedule') html += renderAdminSchedule();
  else if (tab === 'history') html += renderAdminHistory();
  else if (tab === 'empleados') html += renderAdminEmpleados();

  container.innerHTML = html;
}

function renderAdminConflicts() {
  const allC = getAllConflicts();
  let html = `<div class="section-title">⚠️ Conflictos detectados (${allC.reduce((s,a)=>s+a.conflicts.length,0)})</div>`;

  if (!allC.length) {
    html += `<div class="empty-state"><div class="es-icon">✅</div><p>No se detectaron conflictos.</p></div>`;
    return html;
  }

  allC.forEach(({date, conflicts}) => {
    conflicts.forEach(c => {
      const cls = c.severity === 'critical' ? 'alert-red' : 'alert-orange';
      const icon = c.severity === 'critical' ? '🔴' : '🟡';
      html += `<div class="alert ${cls}" style="margin-bottom:8px">
        <span class="alert-icon">${icon}</span>
        <div>
          <strong>${formatDateShort(date)}
          <p>${c.msg}</p>
          <div style="margin-top:5px">
            <button class="btn btn-outline" style="font-size:11px;padding:4px 10px" onclick="state.calSelectedDate='${date}';state.calView='daily';navigate('calendar')">Ver en calendario</button>
          </div>
        </div>
      </div>`;
    });
  });

  // Special inconsistency note
  html += `<div class="alert alert-orange" style="margin-top:4px">
    <span class="alert-icon">📋</span>
    <div>
      <strong>Descansos contradictorios: 26 y 27 de diciembre</strong>
      <p>El PDF original contiene dos listas diferentes de baristas libres según el calendario de cada sede. Los registros se conservan separados (freeB_pcv y freeB_bc). Requiere resolución administrativa antes de comunicar al personal.</p>
    </div>
  </div>`;

  return html;
}

function renderAdminSchedule() {
  let html = `<div class="section-title">📅 Consultar y modificar asignaciones</div>`;

  const dateList = Object.keys(RAW_SCHEDULE).filter(d => !RAW_SCHEDULE[d].noData).sort();

  html += `<div class="date-selector" style="margin-bottom:10px">
    <select id="admin-date-sel" onchange="state.adminDate=this.value;renderPage('admin')" style="flex:1">`;
  dateList.forEach(d => {
    const sel = d === (state.adminDate || REF_TODAY) ? 'selected' : '';
    html += `<option value="${d}" ${sel}>${formatDateShort(d)}</option>`;
  });
  html += `</select></div>`;

  const selDate = state.adminDate || REF_TODAY;
  const sched = getSchedule(selDate);

  if (!sched || sched.noData || sched.holiday) {
    html += `<div class="card-sm"><p style="font-size:13px;color:var(--text-sec)">Sin asignaciones para esta fecha.</p></div>`;
    return html;
  }

  html += `<div class="card">
    <div class="section-title" style="font-size:13px">📌 ${formatDate(selDate)}</div>
    <table class="admin-table">
      <thead><tr><th>Campo</th><th>Valor actual</th><th>Fuente</th></tr></thead>
      <tbody>
        <tr><td>PCV – Cajera</td><td>${sched.pcvC ? `${empName(sched.pcvC)} (${sched.pcvC})` : '—'}</td><td>${sched._modified?'✏️ Modificado':'Documento'}</td></tr>
        <tr><td>PCV – Baristas</td><td>${(sched.pcvB||[]).map(c=>`${empName(c)} (${c})`).join(', ')||'—'}</td><td>Documento</td></tr>
        <tr><td>BC – Cajera(s)</td><td>${(sched.bcCArr||(sched.bcC?[sched.bcC]:[])).map(c=>`${empName(c)} (${c})`).join(', ')||'—'}</td><td>Documento</td></tr>
        <tr><td>BC – Barista</td><td>${(sched.bcB||[]).map(c=>`${empName(c)} (${c})`).join(', ')||'—'}</td><td>Documento</td></tr>
        <tr><td>Libres (C)</td><td>${(sched.freeC||[]).map(c=>empName(c)).join(', ')||'—'}</td><td>Documento</td></tr>
        <tr><td>Libres (B)</td><td>${(sched.freeB||[]).map(c=>empName(c)).join(', ')||'—'}</td><td>Documento</td></tr>
      </tbody>
    </table>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-green" onclick="openEditModal('${selDate}')">✏️ Añadir observación</button>
      ${sched._modified ? `<button class="btn btn-outline" style="color:var(--red);border-color:var(--red)" onclick="revertDate('${selDate}')">↩️ Revertir cambios</button>` : ''}
    </div>
  </div>`;

  return html;
}

function renderAdminHistory() {
  let html = `<div class="section-title">📋 Historial de modificaciones</div>`;

  if (!modHistory.length) {
    html += `<div class="empty-state"><div class="es-icon">📭</div><p>No hay modificaciones registradas.</p></div>`;
  } else {
    modHistory.forEach(h => {
      html += `<div class="history-entry">
        <div class="he-date">${new Date(h.timestamp).toLocaleString('es-VE')} · ${formatDateShort(h.date)}</div>
        <div class="he-desc">${h.description}</div>
      </div>`;
    });
    html += `<button class="btn btn-outline" style="color:var(--red);width:100%;justify-content:center;margin-top:8px" onclick="confirmReset()">🗑️ Limpiar historial y restaurar datos originales</button>`;
  }

  return html;
}

function renderAdminEmpleados() {
  const customNames = JSON.parse(localStorage.getItem('wf_names') || '{}');
  let html = `<div class="section-title">👤 Gestión de empleados</div>
  <p style="font-size:13px;color:var(--text-sec);margin-bottom:16px">
    Cambia el nombre de un empleado (por renuncia u otro motivo) sin afectar el horario rotativo.
    El código interno permanece igual; solo cambia cómo se muestra el nombre.
  </p>`;

  Object.entries(EMPLOYEES_BASE).forEach(([code, emp]) => {
    const current = customNames[code] || emp.name;
    html += `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px;background:var(--surface2);border-radius:10px">
      <span style="width:36px;height:36px;border-radius:50%;background:${emp.color};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0">${code}</span>
      <div style="flex:1">
        <div style="font-size:11px;color:var(--text-sec)">${emp.role} · Código: ${code}</div>
        <input id="emp-name-${code}" type="text" value="${current}"
          style="width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--text)"
          placeholder="${emp.name}" />
        ${customNames[code] ? `<div style="font-size:11px;color:var(--text-sec);margin-top:2px">Original: ${emp.name}</div>` : ''}
      </div>
    </div>`;
  });

  html += `
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn btn-green" style="flex:1;justify-content:center" onclick="saveEmployeeNames()">💾 Guardar nombres</button>
    <button class="btn btn-outline" style="flex:1;justify-content:center;color:var(--red)" onclick="resetEmployeeNames()">↩️ Restaurar originales</button>
  </div>`;

  return html;
}

function saveEmployeeNames() {
  const customNames = {};
  Object.keys(EMPLOYEES_BASE).forEach(code => {
    const input = document.getElementById('emp-name-' + code);
    if (input) {
      const val = input.value.trim();
      if (val && val !== EMPLOYEES_BASE[code].name) customNames[code] = val;
    }
  });
  localStorage.setItem('wf_names', JSON.stringify(customNames));
  // Reload EMPLOYEES with new names
  Object.entries(EMPLOYEES_BASE).forEach(([k,v]) => {
    EMPLOYEES[k] = {...v, name: customNames[k] || v.name};
  });
  renderPage('admin');
  // Show brief confirmation
  setTimeout(() => {
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:9999';
    banner.textContent = '✅ Nombres actualizados';
    document.body.appendChild(banner);
    setTimeout(() => banner.remove(), 2500);
  }, 100);
}

function resetEmployeeNames() {
  localStorage.removeItem('wf_names');
  Object.entries(EMPLOYEES_BASE).forEach(([k,v]) => { EMPLOYEES[k] = {...v}; });
  renderPage('admin');
}

function openEditModal(dateStr) {
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-title">✏️ Añadir observación
    <p style="font-size:13px;color:var(--text-sec);margin-bottom:12px">Las observaciones se guardan como capa adicional. Los datos originales no se eliminan.</p>
    <textarea id="obs-input" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:inherit;font-size:13px;min-height:80px;resize:vertical" placeholder="Escribe tu observación aquí..."></textarea>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-green" style="flex:1;justify-content:center" onclick="saveObservation('${dateStr}')">Guardar</button>
      <button class="btn btn-outline" style="flex:1;justify-content:center" onclick="closeModal()">Cancelar</button>
    </div>`;
  document.getElementById('modal').classList.add('open');
}

function saveObservation(dateStr) {
  const obs = document.getElementById('obs-input').value.trim();
  if (!obs) return;
  saveModification(dateStr, { _observation: obs }, `Observación añadida: "${obs.substring(0,60)}"`);
  closeModal();
  renderPage('admin');
}

function revertDate(dateStr) {
  modifications = modifications.filter(m => m.date !== dateStr);
  modHistory.unshift({ date: dateStr, description: 'Revertido a datos originales', timestamp: new Date().toISOString(), overrides: {} });
  localStorage.setItem('wf_mods', JSON.stringify(modifications));
  localStorage.setItem('wf_history', JSON.stringify(modHistory.slice(0,100)));
  renderPage('admin');
}

function confirmReset() {
  if (confirm('¿Restaurar todos los datos originales y limpiar el historial de modificaciones?')) {
    resetModifications();
    renderPage('admin');
  }
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
  }
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
navigate('home');
</script>
